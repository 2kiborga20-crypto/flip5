
name: Build RATKA for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'receiver.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name RATKA_Receiver receiver.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RATKA-Windows
          path: dist/RATKA_Receiver.exe
          retention-days: 7
